name: Fix working content

on:
  push:
    branches:
      - feat/math1-remaining-content

permissions:
  contents: write

jobs:
  fix:
    if: github.actor == 'sterashima78'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/math1-remaining-content

      - name: Correct standard deviation answer aliases
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/content/math1/data-analysis.ts")
          source = path.read_text()
          old = 'answers: ["√(25/4)", "√25/4", "√(25/4)"]'
          new = 'answers: ["√(25/4)", "sqrt(25/4)"]'
          if source.count(old) != 1:
              raise SystemExit("expected answer alias pattern was not found exactly once")
          path.write_text(source.replace(old, new))
          PY

      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/math1/data-analysis.ts
          git commit -m "fix: correct standard deviation answer aliases"
          git push origin HEAD:feat/math1-remaining-content
