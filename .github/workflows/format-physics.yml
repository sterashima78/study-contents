name: Format Physics Basics

on:
  push:
    branches:
      - feat/physics-basics-content

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/physics-basics-content

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@5d160c5bc68a09337ad0d5654e237e03253b5879 # v1
        with:
          version: 12.0.0-rc.9
          runtime: node@24
          install: false
          cache: false

      - name: Install dependencies
        run: pnpm install

      - name: Format changed files
        run: |
          pnpm exec biome check --write \
            scripts/verify-build-output.mjs \
            src/components/PhysicsExerciseSet.astro \
            src/content/physics-basics/catalog.ts \
            src/content/physics-basics/exercise-registry.ts \
            src/content/physics-basics/formula-derivations.ts

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/verify-build-output.mjs \
            src/components/PhysicsExerciseSet.astro \
            src/content/physics-basics/catalog.ts \
            src/content/physics-basics/exercise-registry.ts \
            src/content/physics-basics/formula-derivations.ts
          git commit -m "style: format physics basics files"
          git push origin HEAD:feat/physics-basics-content
