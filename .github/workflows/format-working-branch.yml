name: Format working branch

on:
  push:
    branches:
      - feat/math1-remaining-content

permissions:
  contents: write

jobs:
  format:
    if: github.actor == 'sterashima78'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/math1-remaining-content

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@5d160c5bc68a09337ad0d5654e237e03253b5879 # v1
        with:
          version: 12.0.0-rc.9
          runtime: node@24
          install: false
          cache: false

      - name: Install dependencies
        run: pnpm install

      - name: Format and apply safe fixes
        run: pnpm exec biome check --write .

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "style: format with biome"
          git push origin HEAD:feat/math1-remaining-content
