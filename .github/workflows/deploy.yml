name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@5d160c5bc68a09337ad0d5654e237e03253b5879 # v1
        with:
          version: 12.0.0
          runtime: node@24
          install: false
          cache: false

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Install dependencies
        run: pnpm install

      - name: Run Biome
        run: pnpm exec biome ci .

      - name: Verify ADRs
        run: pnpm check:adr

      - name: Verify curriculum references
        run: pnpm check:curriculum

      - name: Verify formula coverage
        run: pnpm check:formulas

      - name: Verify application and advanced content
        run: pnpm check:entrance-content

      - name: Verify public-domain text rights
        run: pnpm check:text-rights

      - name: Verify component style boundaries
        run: pnpm check:component-styles

      - name: Verify study AI boundaries
        run: pnpm check:study-ai

      - name: Build
        run: pnpm build

      - name: Verify curriculum references in generated HTML
        run: pnpm check:curriculum-build

      - name: Verify generated HTML
        run: node scripts/verify-build-output.mjs

      - name: Verify English generated HTML
        run: node scripts/verify-english-build-output.mjs

      - name: Verify biology generated HTML
        run: node scripts/verify-biology-build-output.mjs

      - name: Verify Math I application and advanced HTML
        run: node scripts/verify-math1-advanced-build-output.mjs

      - name: Verify all other course application and advanced HTML
        run: node scripts/verify-all-advanced-build-output.mjs

      - name: Verify Math II generated HTML
        run: node scripts/verify-math2-build-output.mjs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
