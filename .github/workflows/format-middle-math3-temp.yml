name: Format middle math3 temporary

on:
  push:
    branches:
      - feat/middle-math3-complete-remaining

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/middle-math3-complete-remaining

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@5d160c5bc68a09337ad0d5654e237e03253b5879 # v1
        with:
          version: 12.0.0
          runtime: node@24
          install: false
          cache: false

      - name: Install dependencies
        run: pnpm install

      - name: Format middle math3 additions
        run: |
          pnpm exec biome format --write src/content/middle-school/math/grade3 src/components/MiddleMathExerciseSet.astro

      - name: Commit formatting only
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/middle-school/math/grade3 src/components/MiddleMathExerciseSet.astro
          git commit -m "Biomeで中3数学追加分を整形"
          git push origin HEAD:feat/middle-math3-complete-remaining
