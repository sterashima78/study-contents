name: CI review repair

on:
  push:
    branches:
      - feature/shared-diagram-components

permissions:
  contents: write

jobs:
  repair:
    if: github.actor == 'sterashima78'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feature/shared-diagram-components

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@5d160c5bc68a09337ad0d5654e237e03253b5879 # v1
        with:
          version: 12.0.0
          runtime: node@24
          install: false
          cache: false

      - name: Install dependencies
        run: pnpm install

      - name: Apply review fixes
        run: |
          printf '%s' '' | base64 -d > /tmp/fix_review.py
          python /tmp/fix_review.py
          pnpm exec biome format --write src/lib/diagram/types.ts src/lib/diagram/editor-client.ts src/lib/diagram/validate.mjs scripts/verify-diagrams.mjs
          pnpm exec biome ci src/lib/diagram/types.ts src/lib/diagram/editor-client.ts src/lib/diagram/validate.mjs scripts/verify-diagrams.mjs

      - name: Commit review fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/diagram/types.ts src/lib/diagram/editor-client.ts src/lib/diagram/validate.mjs scripts/verify-diagrams.mjs
          if ! git diff --cached --quiet; then
            git commit -m "Address diagram component review findings"
            git push origin HEAD:feature/shared-diagram-components
          fi
