name: CI repair

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    if: github.actor == 'sterashima78' && github.head_ref == 'feature/shared-diagram-components'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feature/shared-diagram-components

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@5d160c5bc68a09337ad0d5654e237e03253b5879 # v1
        with:
          version: 12.0.0
          runtime: node@24
          install: false
          cache: false

      - name: Install dependencies
        run: pnpm install

      - name: Apply diagram lint fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          imports = {
              "src/components/diagram/DiagramEditor.astro": 'import DiagramCanvas from "./DiagramCanvas.astro";',
              "src/components/diagram/DiagramExercise.astro": 'import DiagramEditor from "./DiagramEditor.astro";',
              "src/components/diagram/DiagramView.astro": 'import DiagramCanvas from "./DiagramCanvas.astro";',
              "src/components/ui/WorkedExample.astro": 'import DiagramView from "../diagram/DiagramView.astro";',
          }
          for filename, statement in imports.items():
              path = Path(filename)
              text = path.read_text()
              marker = "// biome-ignore lint/correctness/noUnusedImports: Astro template usage is not detected by Biome.\n" + statement
              if marker not in text:
                  text = text.replace(statement, marker)
              path.write_text(text)

          path = Path("src/components/diagram/DiagramCanvas.astro")
          text = path.read_text()
          for name in ("lineExtent", "arcPath", "gridLines"):
              statement = f"const {name} ="
              marker = "// biome-ignore lint/correctness/noUnusedVariables: Astro template usage is not detected by Biome.\n" + statement
              if marker not in text:
                  text = text.replace(statement, marker)
          path.write_text(text)

          path = Path("src/lib/diagram/validate.mjs")
          text = path.read_text().replace(
              "if (!symbols || !symbols.has(element.symbol)) {",
              "if (!symbols?.has(element.symbol)) {",
          )
          path.write_text(text)

          path = Path("scripts/verify-diagrams.mjs")
          text = path.read_text().replace(
              'value.forEach((item, index) => visit(item, `${location}[${index}]`));',
              'value.forEach((item, index) => {\n      visit(item, `${location}[${index}]`);\n    });',
          )
          path.write_text(text)
          PY

      - name: Format diagram files
        run: |
          pnpm exec biome format --write scripts/verify-diagrams.mjs src/lib/diagram src/components/diagram src/components/ui/WorkedExample.astro
          pnpm exec biome check --write --unsafe scripts/verify-diagrams.mjs src/lib/diagram || true

      - name: Commit repaired implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/verify-diagrams.mjs src/lib/diagram src/components/diagram src/components/ui/WorkedExample.astro
          if ! git diff --cached --quiet; then
            git commit -m "Format and fix diagram implementation"
            git push origin HEAD:feature/shared-diagram-components
          fi
