name: CI repair

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    if: github.actor == 'sterashima78' && github.head_ref == 'feature/shared-diagram-components'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feature/shared-diagram-components

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@5d160c5bc68a09337ad0d5654e237e03253b5879 # v1
        with:
          version: 12.0.0
          runtime: node@24
          install: false
          cache: false

      - name: Install dependencies
        run: pnpm install

      - name: Apply lint fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              "src/components/diagram/DiagramEditor.astro": (
                  'import DiagramCanvas from "./DiagramCanvas.astro";',
                  '// biome-ignore lint/correctness/noUnusedImports: Astro template usage is not detected by Biome.\nimport DiagramCanvas from "./DiagramCanvas.astro";',
              ),
              "src/components/diagram/DiagramExercise.astro": (
                  'import DiagramEditor from "./DiagramEditor.astro";',
                  '// biome-ignore lint/correctness/noUnusedImports: Astro template usage is not detected by Biome.\nimport DiagramEditor from "./DiagramEditor.astro";',
              ),
              "src/components/diagram/DiagramView.astro": (
                  'import DiagramCanvas from "./DiagramCanvas.astro";',
                  '// biome-ignore lint/correctness/noUnusedImports: Astro template usage is not detected by Biome.\nimport DiagramCanvas from "./DiagramCanvas.astro";',
              ),
              "src/components/ui/WorkedExample.astro": (
                  'import DiagramView from "../diagram/DiagramView.astro";',
                  '// biome-ignore lint/correctness/noUnusedImports: Astro template usage is not detected by Biome.\nimport DiagramView from "../diagram/DiagramView.astro";',
              ),
          }
          for filename, (old, new) in replacements.items():
              path = Path(filename)
              text = path.read_text()
              if new not in text:
                  text = text.replace(old, new)
              path.write_text(text)

          path = Path("src/components/diagram/DiagramCanvas.astro")
          text = path.read_text()
          for name in ("lineExtent", "arcPath", "gridLines"):
              old = f"const {name} ="
              new = f"// biome-ignore lint/correctness/noUnusedVariables: Astro template usage is not detected by Biome.\nconst {name} ="
              if new not in text:
                  text = text.replace(old, new)
          path.write_text(text)

          path = Path("src/lib/diagram/validate.mjs")
          text = path.read_text()
          text = text.replace(
              "if (!symbols || !symbols.has(element.symbol)) {",
              "if (!symbols?.has(element.symbol)) {",
          )
          text = text.replace(
              '''      else\n        element.points.forEach((value, index) =>\n          validatePoint(value, `${location}.points[${index}]`, errors),\n        );''',
              '''      else {\n        element.points.forEach((value, index) => {\n          validatePoint(value, `${location}.points[${index}]`, errors);\n        });\n      }''',
          )
          text = text.replace(
              '''      else\n        element.samples.forEach((value, index) =>\n          validatePoint(value, `${location}.samples[${index}]`, errors),\n        );''',
              '''      else {\n        element.samples.forEach((value, index) => {\n          validatePoint(value, `${location}.samples[${index}]`, errors);\n        });\n      }''',
          )
          path.write_text(text)

          path = Path("scripts/verify-diagrams.mjs")
          text = path.read_text().replace(
              'value.forEach((item, index) => visit(item, `${location}[${index}]`));',
              '''value.forEach((item, index) => {\n      visit(item, `${location}[${index}]`);\n    });''',
          )
          path.write_text(text)
          PY

      - name: Format and verify Biome
        run: |
          pnpm exec biome check --write .
          pnpm exec biome ci .

      - name: Commit formatted implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/verify-diagrams.mjs src/lib/diagram src/components/diagram src/components/ui/WorkedExample.astro
          if ! git diff --cached --quiet; then
            git commit -m "Format and fix diagram implementation"
            git push origin HEAD:feature/shared-diagram-components
          fi
