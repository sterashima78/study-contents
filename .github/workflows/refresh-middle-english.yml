# One-time branch-only refresh after packageManager synchronization.
name: Refresh middle English completion

on:
  push:
    branches:
      - feat/middle-english-complete
    paths:
      - .github/workflows/refresh-middle-english.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout work branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/middle-english-complete
          fetch-depth: 0

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@5d160c5bc68a09337ad0d5654e237e03253b5879 # v1
        with:
          version: 12.2.1
          runtime: node@24
          install: false
          cache: false

      - name: Update pinned dependency versions
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const packagePath = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(packagePath, 'utf8'));
          pkg.packageManager = 'pnpm@12.2.1';
          pkg.dependencies.astro = '7.2.10';
          pkg.dependencies['@mlc-ai/web-llm'] = '0.2.84';
          fs.writeFileSync(packagePath, `${JSON.stringify(pkg, null, 2)}\n`);

          for (const workflowPath of ['.github/workflows/ci.yml', '.github/workflows/deploy.yml']) {
            const source = fs.readFileSync(workflowPath, 'utf8');
            fs.writeFileSync(workflowPath, source.replace('version: 12.0.0', 'version: 12.2.1'));
          }
          NODE

      - name: Regenerate lockfile from public registry
        run: pnpm install --lockfile-only

      - name: Format changed source
        run: >-
          pnpm exec biome check --write
          package.json
          scripts/verify-curriculum-references.mjs
          scripts/verify-curriculum-build-output.mjs
          scripts/verify-english-build-output.mjs
          src/components/EnglishLesson.astro
          src/components/MiddleEnglishExerciseSet.astro
          src/components/MiddleEnglishListeningPractice.astro
          src/components/ui/StudyPage.astro
          src/content/curriculum-reference-resolver.js
          src/content/english/course.ts
          src/content/middle-school/english
          src/pages/middle-school/english
          src/pages/middle-school/index.astro

      - name: Run repository checks
        run: pnpm check

      - name: Build
        run: pnpm build

      - name: Verify curriculum references in generated HTML
        run: pnpm check:curriculum-build

      - name: Verify English generated HTML
        run: node scripts/verify-english-build-output.mjs

      - name: Remove one-time workflow
        run: rm .github/workflows/refresh-middle-english.yml

      - name: Commit verified refresh
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "依存関係を最新版へ更新して中学英語を検証"
          git push origin HEAD:feat/middle-english-complete
