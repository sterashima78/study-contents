name: Format helper

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'feature/exercise-diagnostics' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feature/exercise-diagnostics

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@5d160c5bc68a09337ad0d5654e237e03253b5879 # v1
        with:
          version: 11.24.0
          runtime: node@24
          install: false
          cache: false

      - name: Install dependencies
        run: pnpm install

      - name: Format generator
        run: pnpm exec biome format --write src/content/math1/exercise-generators.ts

      - name: Commit formatting
        run: |
          if git diff --quiet -- src/content/math1/exercise-generators.ts; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/content/math1/exercise-generators.ts
          git commit -m "Format exercise generators with Biome"
          git push origin HEAD:feature/exercise-diagnostics
